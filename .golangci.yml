version: "2"
linters:
  # Complexity limits; tests are exempt.
  enable: [gocyclo, gocognit, funlen, nestif, dupl, misspell, goclocbudget]
  settings:
    gocyclo:
      min-complexity: 12
    gocognit:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    nestif:
      min-complexity: 5
    dupl:
      threshold: 100
    custom:
      goclocbudget:
        type: "module"
        description: "Enforces the implementation Go LOC budget using gocloc."
        settings:
          # Implementation Go LOC ceiling (tests excluded). Before raising it,
          # trim lines; raise only to the measured count. History: git log -p .golangci.yml
          max-go-code-lines: 2970
          include-tests: false
          exclude-generated: true
          exclude-dirs: [tools]
  exclusions:
    rules:
      - path: _test\.go
        linters: [gocyclo, gocognit, funlen, nestif, dupl]
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/invokr-agent/agent-relay]
